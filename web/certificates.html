<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Certificates</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body>
<header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a><a aria-current="page" href="/certificates">Certificates</a></nav></header>
<main>
  <div class="page-title"><div><h1>Transit certificates</h1><div class="muted">Irreplicable evidence issued only for completed transits with a confirmed signal handoff</div></div><span class="status" id="count"></span></div>
  <div class="grid">
    <section class="panel wide"><h2>Look up by transit cycle</h2>
      <form id="lookup-form">
        <div class="form-row" style="grid-template-columns:2fr auto;">
          <div><label for="cycle-id">Transit cycle identifier</label><input id="cycle-id" placeholder="Full cycle UUID"></div>
          <div><label>&nbsp;</label><button type="submit">Issue / inspect</button></div>
        </div>
        <div class="message" id="lookup-message"></div>
        <div id="lookup-result"></div>
      </form>
    </section>
    <section class="panel wide"><h2>Transit register</h2>
      <table><thead><tr><th>Chamber</th><th>Cycle</th><th>Direction</th><th>Stage</th><th>Certificate / refusal</th><th>Completed</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="message" id="message"></div>
    </section>
  </div>
</main>
<script src="/assets/app.js"></script><script src="/assets/certificates.js"></script>
</body></html>
